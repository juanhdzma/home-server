services:
  libredb-studio:
    container_name: libredb
    image: ghcr.io/libredb/libredb-studio:latest
    restart: unless-stopped
    volumes:
      - libredb_data:/app/data
    networks:
      - infra_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra_proxy:
    external: true

volumes:
  libredb_data:
