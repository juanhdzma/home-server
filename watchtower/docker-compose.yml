services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      TZ: "America/Bogota"
      WATCHTOWER_SCHEDULE: "0 0 2 * * *"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: "update"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN}"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_NOTIFICATION_URL: "telegram://${TELEGRAM_BOT_TOKEN}@telegram?chats=${TELEGRAM_CHAT_ID}&parsemode=HTML"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_NOTIFICATION_SKIP_TITLE: "true"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_NOTIFICATION_TEMPLATE: |-
        {{- with .Report -}}
        {{- if or .Updated .Failed -}}
        📦 <b>Watchtower update on home-server</b>
        {{- with $$.Entries}}
        <code>{{(index . 0).Time.Format "2006-01-02 15:04"}}</code>{{end}}
        {{range .Updated}}
        🟢 <b>{{.Name}}</b> · <code>{{.CurrentImageID.ShortID}} → {{.LatestImageID.ShortID}}</code>
        {{- end}}
        {{- range .Failed}}
        🔴 <b>{{.Name}}</b> · <code>{{.ImageName}}</code>{{with .Error}} · {{html .}}{{end}}
        {{- end}}
        {{- end -}}
        {{- end -}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infra_proxy

networks:
  infra_proxy:
    external: true
