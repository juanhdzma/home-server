services:
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    ports:
      - "9443:9443"
    networks:
      - infra_proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra_proxy:
    external: true

volumes:
  data:
