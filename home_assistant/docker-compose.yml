services:
  home_assistant:
    container_name: home_assistant
    image: ghcr.io/home-assistant/home-assistant:latest
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=America/Bogota
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  config:
